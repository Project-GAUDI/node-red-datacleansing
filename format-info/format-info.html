<!-- ノードのプロパティに関する定義 -->
<script type="text/javascript">
(function() {
    // ノードカテゴリの定義
    const myNodeCategory = "config";
    // ノード論理名の定義
    const myNodeName = "format-info";
    // ノード表示名の定義
    const myNodeDispName = "Format Info";
    // ノード色の定義
    const myNodeColor = "#3FADB5";
    // アイコン名の定義
    const myIconName = "GAUDIlogo.png";

    // プロパティデフォルト値
    const prop_default_fmtinfos = "[{\"fno\":\"000\", \"fmt\":\"{}\"}]";

    function createWarningMessage(key, replaceObj) {
        let message;
        const warnings = {
            "array-length-zero": "__prefix__: __name__配列の長さが0です。",
            "contain-not-match-conditions": "__prefix__: __name__内に__conditions__以外が含まれます。",
            "empty":"__prefix__: __name__が空です。",
            "empty_base":"__prefix__: 空欄です。",
            "not-match-conditions": "__prefix__: __name__が__conditions__ではありません。",
            "not-set-required": "__prefix__: __name__が存在しません。",
            "not-type-object_base": "__prefix__: 型がobjectではありません。",
            "not-type-array": "__prefix__: __name__が配列ではありません。",
            "not-type-string": "__prefix__: __name__が文字列ではありません。",
            "not-type-bool": "__prefix__: __name__が真偽値ではありません。",
            "not-integer": "__prefix__: __name__が整数ではありません。",
            "null_base": "__prefix__: nullです。"
        };
        if (key in warnings) {
            message = warnings[key];
            message = message.replace(/__([a-zA-Z0-9_]+)__/g, function (match, p1) {
                if (p1 in replaceObj) {
                    return replaceObj[p1];
                } else {
                    return match;
                }
            });
        } else {
            message = "バリデーションメッセージ作成失敗";
        }
        return message;
    }

    function CheckFormatInfos(fmtinfoArray){
        let result = true;
        let message = "";
        const formatIdUnique = new Set();

        // フォーマットリストの長さチェック
        if(fmtinfoArray.length < 1){
            result = false;
            message = "フォーマット情報リストに設定が存在しません。";
            return { result: result, message: message };
        }

        fmtinfoArray.map(( fmtinfoObj,fmtinfoIndex ) =>{
            const fno = fmtinfoObj.fno;
            const fmt = fmtinfoObj.fmt;
            formatIdUnique.add(fno);

            const decimalPattern = /^-?\d*\.\d+$/;

            const prefix_base = `フォーマット情報リスト${fmtinfoIndex+1}`;
            const prefix_fno = `${prefix_base}(フォーマットID)`;
            const prefix_fmt = `${prefix_base}(フォーマット情報)`;

            // フォーマットIDの空白チェック
            if("" == fno){
                result = false;
                message = createWarningMessage("empty_base",{"prefix":prefix_fno});
                return { result: result, message: message };
            }
            // フォーマット情報の空白チェック
            if("" == fmt){
                result = false;
                message = createWarningMessage("empty_base",{"prefix":prefix_fmt});
                return { result: result, message: message };
            }
            // フォーマット情報の型チェック(Object)
            const fmtObj = JSON.parse(fmt);
            if(null === fmtObj){
                result = false;
                message = createWarningMessage("null_base",{"prefix":prefix_fmt});
                return { result: result, message: message };
            }
            if("object" !== typeof fmtObj || true == Array.isArray(fmtObj)){
                result = false;
                message = createWarningMessage("not-type-object_base",{"prefix":prefix_fmt});
                return { result: result, message: message };
            }
            // フォーマット情報の必須プロパティチェック
            if(false==("OutputData" in fmtObj)){
                result = false;
                message = createWarningMessage("not-set-required",{"prefix":prefix_fmt,"name":`OutputData`});
                return { result: result, message: message };
            }
            if(false==(Array.isArray(fmtObj.OutputData))){
                result = false;
                message = createWarningMessage("not-type-array",{"prefix":prefix_fmt,"name":`OutputData`});
                return { result: result, message: message };
            }
            if(fmtObj.OutputData.length < 1){
                result = false;
                message = createWarningMessage("array-length-zero",{"prefix":prefix_fmt,"name":`OutputData`});
                return { result: result, message: message };
            }
            fmtObj.OutputData.map(( output,odIndex ) =>{
                if(false == ("OutputIndex" in output)){
                    result = false;
                    message = createWarningMessage("not-set-required",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].OutputIndex`});
                    return { result: result, message: message };
                }
                if("number" !== typeof output.OutputIndex && "Property" !== output.OutputIndex && "PropertyAddOnly" !== output.OutputIndex){
                    result = false;
                    message = createWarningMessage("not-match-conditions",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].OutputIndex`,"conditions":`数値または特定の文字列`});
                    return { result: result, message: message };
                }
                if(true == decimalPattern.test(output.OutputIndex)){
                    result = false;
                    message = createWarningMessage("not-integer",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].OutputIndex`});
                    return { result: result, message: message };
                }
                if(false == ("OutputName" in output) && ("Property" === output.OutputIndex || "PropertyAddOnly" === output.OutputIndex)){
                    result = false;
                    message = createWarningMessage("not-set-required",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].OutputName`});
                    return { result: result, message: message };
                }
                if(false==("InputIndex" in output)){
                    result = false;
                    message = createWarningMessage("not-set-required",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].InputIndex`});
                    return { result: result, message: message };
                }
                if(false==(Array.isArray(output.InputIndex))){
                    result = false;
                    message = createWarningMessage("not-type-array",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].InputIndex`});
                    return { result: result, message: message };
                }
                if(output.InputIndex.length < 1){
                    result = false;
                    message = createWarningMessage("array-length-zero",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].InputIndex`});
                    return { result: result, message: message };
                }
                if(false==(output.InputIndex.every(value => typeof value === "number"))){
                    result = false;
                    message = createWarningMessage("contain-not-match-conditions",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].InputIndex`,"conditions":`数値`});
                    return { result: result, message: message };
                }
                if(true==(output.InputIndex.every(value => decimalPattern.test(value)))){
                    result = false;
                    message = createWarningMessage("contain-not-match-conditions",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].InputIndex`,"conditions":`整数`});
                    return { result: result, message: message };
                }
                if(false==("Converters" in output)){
                    result = false;
                    message = createWarningMessage("not-set-required",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].Converters`});
                    return { result: result, message: message };
                }
                if(false==(Array.isArray(output.Converters))){
                    result = false;
                    message = createWarningMessage("not-type-array",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].Converters`});
                    return { result: result, message: message };
                }
                if(output.Converters.length < 1){
                    result = false;
                    message = createWarningMessage("array-length-zero",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].Converters`});
                    return { result: result, message: message };
                }
                output.Converters.map(( converter,convIndex ) =>{
                    if(false==("Converter" in converter)){
                        result = false;
                        message = createWarningMessage("not-set-required",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].Converters[${convIndex}].Converter`});
                        return { result: result, message: message };
                    }
                    if("string" !== typeof converter.Converter){
                        result = false;
                        message = createWarningMessage("not-type-string",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].Converters[${convIndex}].Converter`});
                        return { result: result, message: message };
                    }
                    if(false==("Enabled" in converter)){
                        result = false;
                        message = createWarningMessage("not-set-required",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].Converters[${convIndex}].Enabled`});
                        return { result: result, message: message };
                    }
                    if("boolean" !== typeof converter.Enabled){
                        result = false;
                        message = createWarningMessage("not-type-bool",{"prefix":prefix_fmt,"name":`OutputData[${odIndex}].Converters[${convIndex}].Enabled`});
                        return { result: result, message: message };
                    }
                });
            });
        });

        // フォーマットIDの重複チェック
        if(formatIdUnique.size != fmtinfoArray.length){
            result = false;
            message = `フォーマットIDの重複が存在します。`;
            return { result: result, message: message };
        }

        return { result: result, message: message };
    }

    // 警告通知オプション作成
    function createWarningNotifyOps(){
        let notifyRef;
        const notifyOpts = {
            type: "warning",
            fixed: "true",
            buttons:[
                {
                    text:"閉じる",
                    class:"primary",
                    click: function(){
                        if(notifyRef){
                            notifyRef.close();
                        }
                    }
                }
            ]
        }
        return { notifyOpts, setNotify: (n) => {notifyRef = n;} };
    }

    RED.nodes.registerType(myNodeName, {
        category: myNodeCategory,
        color: myNodeColor,
        defaults: {
            name: { value: "Format Info" },
            fmtinfos: {
                value:prop_default_fmtinfos,
                validate:function(v){
                    let fmtinfoArray = JSON.parse(v);
                    var { result, message } = CheckFormatInfos(fmtinfoArray);
                    return result;
                }
            }
        },
        icon: myIconName,
        label: function () {
            return this.name || myNodeDispName;
        },
        paletteLabel: function () {
            return myNodeDispName;
        },
        oneditprepare: function () {
            var node = this;

            $("#node-config-input-format-container").css('min-height', '150px').css('min-width', '400px').editableList({
                addItem: function (container, i, opt) {
                    if (!opt.hasOwnProperty('fno')) {
                        opt.fno = "000";
                    }
                    if (!opt.hasOwnProperty('fmt')) {
                        opt.fmt = "{}";
                    }

                    // 行分割
                    var row = $('<div/>').appendTo(container);
                    row.css({
                        overflow: 'hidden',
                        whiteSpace: 'nowrap'
                    });

                    // フォーマットIDラベル
                    var fnoLabel = $('<label/>', {
                        for: "node-config-input-fno-value",
                        type: "text"
                    }).text("フォーマットID").css('min-width', '120px').appendTo(row);

                    // フォーマットID
                    var fnoField = $('<input/>', {
                        class: "node-config-input-fno-value",
                        type: "text"
                    }).css('max-width', '100px').appendTo(row);
                    fnoField.typedInput({ default: 'str', types: ['str'] });
                    fnoField.typedInput('value', opt.fno);
                    fnoField.typedInput('type', 'str');

                    // フォーマット情報ラベル
                    var fmtLabel = $('<label/>', {
                        for: "node-config-input-fmt-value",
                        type: "text",
                        style: "margin-left: 15px;"
                    }).text("フォーマット情報").css('min-width', '120px').appendTo(row);

                    // フォーマット情報
                    var fmtField = $('<input/>', {
                        class: "node-config-input-fmt-value",
                        type: "json"
                    }).css('max-width', '220px').appendTo(row);
                    fmtField.typedInput({ default: 'json', types: ['json'] });
                    fmtField.typedInput('value', opt.fmt);
                    fmtField.typedInput('type', 'json');

                },
                sortable: true,
                removable: true
            });

            var container = $("#node-config-input-format-container");
            container.editableList('empty');
            var fmtdata = JSON.parse(node.fmtinfos);
            for (var i = 0; i < fmtdata.length; i++) {
                var fmtinfo = fmtdata[i];
                container.editableList('addItem', fmtinfo);
            }
        },
        oneditsave: function() {
            var formats = $("#node-config-input-format-container").editableList('items');
            var node = this;

            var infosdata = [];
            formats.each(function(i) {
                var ifmt = $(this);
                var fno = ifmt.find(".node-config-input-fno-value");
                var fmt = ifmt.find(".node-config-input-fmt-value");
                var data = {fno:fno.typedInput('value'), fmt:fmt.typedInput('value')};
                infosdata.push(data);
            });

            const { result, message } = CheckFormatInfos(infosdata);
            if(false == result){
                const { notifyOpts, setNotify } = createWarningNotifyOps();
                const notify=RED.notify(message,notifyOpts);
                setNotify(notify);
            }

            $("#node-config-input-fmtinfos").val(JSON.stringify(infosdata));
        },
        oneditresize: function (size) {
            var rows = $("#node-config-dialog-edit-form>div:not(.node-config-input-format-container-row)");
            var height = size.height;
            for (var i = 0; i < rows.length; i++) {
                height -= $(rows[i]).outerHeight(true);
            }
            var editorRow = $("#node-config-dialog-edit-form>div.node-config-input-format-container-row");
            height -= (parseInt(editorRow.css("marginTop")) + parseInt(editorRow.css("marginBottom")));
            $("#node-config-input-format-container").editableList('height', height);
        }
    });
})();
</script>

<!-- ノードプロパティ編集画面 -->
<script type="text/html" data-template-name="format-info">
    <div class="form-row" style="white-space:nowrap;">
        <label style="width:170px;"><i class="fa fa-tag"></i> 名前</label>
        <input type="text" id="node-config-input-name" placeholder="FormatInfo">
    </div>
    <input type="hidden" id="node-config-input-fmtinfos"/>
    <div class="form-row node-config-input-format-container-row">
        <ol id="node-config-input-format-container"></ol>
    </div>
</script>

<!-- ノードヘルプ -->
<script type="text/html" data-help-name="format-info">
    <p>ノードプロパティでフォーマットIDとそのIDに対する定義情報を設定します。</p>
    <h3>プロパティ</h3>
    <dl class="node-config-input-fno-value">
        <dt>フォーマットID<span class="property-type">文字列</span></dt>
        <dd>フォーマット情報に紐づけるIDを指定する。</dd>
    </dl>
    <dl class="node-config-input-fmt-value">
        <dt>フォーマット情報<span class="property-type">JSON</span></dt>
        <dd>フォーマットの定義情報を記述する。</dd>
    </dl>

    <h3>フォーマット定義情報</h3>
    <ol class="format-info">
        <table>
            <tr>
                <td>JSON Key</td>
                <td>Type</td>
                <td>Required</td>
                <td>Description</td>
            </tr>
            <tr>
                <td>FormatNo</td>
                <td>string</td>
                <td>　</td>
                <td>フォーマットID</td>
            </tr>
            <tr>
                <td>OutputData</td>
                <td>array</td>
                <td>○</td>
                <td>出力データ情報リスト</td>
            </tr>
            <tr>
                <td>&nbsp; OutputIndex</td>
                <td>int</td>
                <td>○</td>
                <td>出力データインデックス（1 ～）</td>
            </tr>
            <tr>
                <td>&nbsp; InputIndex</td>
                <td>int array</td>
                <td>○</td>
                <td>入力データインデックス（1 ～）リスト</td>
            </tr>
            <tr>
                <td>&nbsp; Converters</td>
                <td>array</td>
                <td>○</td>
                <td>変換情報リスト</td>
            </tr>
            <tr>
                <td>&nbsp; &nbsp; Converter</td>
                <td>string</td>
                <td>○</td>
                <td>変換関数名<br>使用可能な関数は、data-cleansing ノードの説明を参照。</td>
            </tr>
            <tr>
                <td>&nbsp; &nbsp; Enabled</td>
                <td>boolean</td>
                <td>○</td>
                <td>有効/無効。true の場合、変換関数を適用する。</td>
            </tr>
            <tr>
                <td>&nbsp; &nbsp; Options</td>
                <td>array</td>
                <td>○</td>
                <td>変換オプションデータ。変換関数で必要な追加情報を指定する。</td>
            </tr>
        </table>
    </ol>
</script>
